name: Splash Android Preview

on:
  pull_request:
    paths:
      - ".github/workflows/splash-android-preview.yml"
      - "Assets/Editor/SplashPreviewBuild.cs"
      - "Assets/Editor/SplashPreviewBuild.cs.meta"
      - "Assets/Scenes/SplashScene.unity"
      - "Assets/Scenes/SplashScene.unity.meta"
      - "Assets/SCRIPT/SplashLoader.cs"
      - "Assets/SCRIPT/SplashLoader.cs.meta"
      - "Assets/SCRIPT/Design/SplashCaptureBootstrap.cs"
      - "Assets/SCRIPT/Design/SplashCaptureBootstrap.cs.meta"
      - "Assets/SCRIPT/Design/SplashDesign.cs"
      - "Assets/SCRIPT/Design/SplashDesign.cs.meta"
      - "Assets/SCRIPT/RuntimeUI/RuntimeUI.cs"
      - "Assets/SCRIPT/RuntimeUI/RuntimeUI.cs.meta"
      - "Assets/SCRIPT/Design/ConvergingLight.cs"
      - "Assets/SCRIPT/Design/ConvergingLight.cs.meta"
      - "Assets/SCRIPT/Design/ExactReferenceVisuals.cs"
      - "Assets/SCRIPT/Design/ExactReferenceVisuals.cs.meta"
      - "Assets/SCRIPT/Design/AttachmentReskinVisuals.cs"
      - "Assets/SCRIPT/Design/AttachmentReskinVisuals.cs.meta"
      - "Assets/SCRIPT/Design/AttachmentReskinPolish.cs"
      - "Assets/SCRIPT/Design/AttachmentReskinPolish.cs.meta"
      - "Assets/SCRIPT/Design/AttachmentReskinCanvasBindings.cs"
      - "Assets/SCRIPT/Design/AttachmentReskinCanvasBindings.cs.meta"
      - "Assets/newdesign/Resources/splash/**"
      - "Assets/newdesign/Resources/reference/hol_logo_exact.png"
      - "Assets/newdesign/Resources/reference/hol_logo_exact.png.meta"
      - "Assets/newdesign/Resources/reference/mascot_6_exact.png"
      - "Assets/newdesign/Resources/reference/mascot_6_exact.png.meta"
      - "Assets/newdesign/Resources/reference/mascot_7_exact.png"
      - "Assets/newdesign/Resources/reference/mascot_7_exact.png.meta"
      - "Assets/Tests/PlayMode/SplashCapturePlayModeTests.cs"
      - "Assets/Tests/PlayMode/SplashCapturePlayModeTests.cs.meta"
      - "Assets/Tests/PlayMode/SplashAuthoritativeVisualsPlayModeTests.cs"
      - "Assets/Tests/PlayMode/SplashAuthoritativeVisualsPlayModeTests.cs.meta"
      - "Assets/Tests/EditMode/SplashProductionAssetsTests.cs"
      - "Assets/Tests/EditMode/SplashProductionAssetsTests.cs.meta"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splash-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build development x86_64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "::error::$name is not configured"
              exit 1
            }
          done

      - name: Free runner disk for Unity Android image
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-Splash-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Development x86_64 Splash APK
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: SplashPreviewBuild.Build
          versioning: None

      - name: Require exact APK output
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" build
          test -f build/Android/HOL-splash-debug.apk

      - name: Transfer APK to emulator job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splash-preview-apk-transfer
          path: build/Android/HOL-splash-debug.apk
          if-no-files-found: error
          retention-days: 1

  capture:
    name: Capture Splash at 1080x1920
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: splash-preview-apk-transfer
          path: build/Android

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Prepare fail-safe Splash capture script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/splash-android-preview
          test -f build/Android/HOL-splash-debug.apk
          cp build/Android/HOL-splash-debug.apk \
            artifacts/splash-android-preview/HOL-splash-debug.apk
          for diagnostic in \
            logcat.txt \
            display-size-density.txt \
            display-metadata.txt \
            activity-state.txt \
            package-metadata.txt \
            package-path.txt \
            process-state.txt \
            install.log \
            start.log; do
            echo "Capture script did not start." \
              > "artifacts/splash-android-preview/$diagnostic"
          done

          cat > "$RUNNER_TEMP/splash-capture.sh" <<'CAPTURE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          apk="build/Android/HOL-splash-debug.apk"
          output="artifacts/splash-android-preview"
          aapt_path=
          package_name=
          launch_activity=

          collect_diagnostics() {
            status=$?
            trap - EXIT
            set +e
            mkdir -p "$output"

            if [ -z "${package_name:-}" ] &&
               [ -x "${aapt_path:-}" ] &&
               [ -f "$apk" ]; then
              package_name=$("$aapt_path" dump badging "$apk" 2>/dev/null |
                sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            fi

            if command -v adb >/dev/null 2>&1 &&
               adb get-state >/dev/null 2>&1; then
              adb logcat -d -v threadtime > "$output/logcat.txt" 2>&1
              {
                adb shell wm size
                adb shell wm density
              } > "$output/display-size-density.txt" 2>&1
              adb shell dumpsys display > "$output/display-metadata.txt" 2>&1
              adb shell dumpsys activity activities \
                > "$output/activity-state.txt" 2>&1

              if [ -n "${package_name:-}" ]; then
                adb shell dumpsys package "$package_name" \
                  > "$output/package-metadata.txt" 2>&1
                adb shell pm path "$package_name" \
                  > "$output/package-path.txt" 2>&1
                {
                  adb shell pidof "$package_name"
                  adb shell ps -A
                } > "$output/process-state.txt" 2>&1
              else
                echo "Package name was not discoverable." \
                  > "$output/package-metadata.txt"
                echo "Package name was not discoverable." \
                  > "$output/package-path.txt"
                adb shell ps -A > "$output/process-state.txt" 2>&1
              fi
            else
              echo "adb or the emulator is unavailable." > "$output/logcat.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/display-size-density.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/display-metadata.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/activity-state.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/package-metadata.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/package-path.txt"
              echo "adb or the emulator is unavailable." \
                > "$output/process-state.txt"
            fi

            exit "$status"
          }
          trap 'collect_diagnostics' EXIT

          test -f "$apk"
          aapt_path="$(ls "$ANDROID_HOME"/build-tools/*/aapt |
            sort -V |
            tail -n 1)"
          test -x "$aapt_path"
          "$aapt_path" dump badging "$apk" > "$output/aapt-badging.txt"
          package_name=$("$aapt_path" dump badging "$apk" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          launch_activity=$("$aapt_path" dump badging "$apk" |
            sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
          test -n "$package_name"
          test -n "$launch_activity"

          adb wait-for-device
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed

          if adb install -r "$apk" > "$output/install.log" 2>&1; then
            :
          else
            status=$?
            exit "$status"
          fi
          adb logcat -c
          adb shell am force-stop "$package_name"
          if adb shell am start -W \
              -n "$package_name/$launch_activity" \
              --es hol_capture_screen splash \
              > "$output/start.log" 2>&1; then
            :
          else
            status=$?
            exit "$status"
          fi

          ready=0
          for attempt in $(seq 1 60); do
            adb logcat -d -v brief > "$output/marker-logcat.txt"
            if grep -Fq "HOL_SPLASH_CAPTURE_READY" \
                "$output/marker-logcat.txt"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Timed out waiting for HOL_SPLASH_CAPTURE_READY"
            exit 1
          fi
          marker_count=$(grep -Fc "HOL_SPLASH_CAPTURE_READY" \
            "$output/marker-logcat.txt" || true)
          if [ "$marker_count" -ne 1 ]; then
            echo "::error::Expected exactly one HOL_SPLASH_CAPTURE_READY marker"
            exit 1
          fi

          adb exec-out screencap -p > "$output/splash.png"

          python3 - "$output/splash.png" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as image:
              header = image.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
              raise SystemExit(f"{path}: invalid PNG IHDR")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (1080, 1920):
              raise SystemExit(
                  f"{path}: expected 1080x1920, got {width}x{height}")
          print(f"{path}: {width}x{height}")
          PY

          (
            cd "$output"
            sha256sum \
              HOL-splash-debug.apk \
              splash.png > SHA256SUMS
          )
          CAPTURE_SCRIPT
          chmod +x "$RUNNER_TEMP/splash-capture.sh"

      - name: Boot API 35 x86_64 emulator and capture Splash
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ${{ runner.temp }}/splash-capture.sh

      - name: Upload complete Splash Android preview artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hol-splash-android-preview
          path: artifacts/splash-android-preview
          if-no-files-found: error
          retention-days: 7

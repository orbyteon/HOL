name: Enable Google Play Android Developer API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-google-play-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hol-google-play-api-enable
  cancel-in-progress: false

jobs:
  enable:
    name: Enable androidpublisher.googleapis.com
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT_NUMBER: ${{ vars.GOOGLE_CLOUD_PROJECT_NUMBER }}
      EXPECTED_PROJECT_NUMBER: "112109012903"
    steps:
      - name: Enforce production project
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::API enablement must run from main (got $GITHUB_REF)"
            exit 1
          }
          test "$GOOGLE_CLOUD_PROJECT_NUMBER" = "$EXPECTED_PROJECT_NUMBER" || {
            echo "::error::Refusing to enable an API in unexpected project $GOOGLE_CLOUD_PROJECT_NUMBER"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Google auth dependency
        working-directory: services/provisioner
        run: npm ci --no-audit --no-fund

      - name: Enable Google Play Android Developer API
        working-directory: services/provisioner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const project = (process.env.GOOGLE_CLOUD_PROJECT_NUMBER || '').trim();
          const expected = (process.env.EXPECTED_PROJECT_NUMBER || '').trim();
          const encoded = (process.env.GOOGLE_SERVICE_ACCOUNT_JSON_B64 || '').trim();
          if (!project || project !== expected) throw new Error(`Unexpected Google Cloud project ${project || '(missing)'}`);
          if (!encoded) throw new Error('GOOGLE_SERVICE_ACCOUNT_JSON_B64 is missing');

          let credentials;
          try {
            credentials = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
          } catch (error) {
            throw new Error(`Google service account credential is not valid base64 JSON: ${error.message}`);
          }
          if (!credentials.client_email || !credentials.private_key) {
            throw new Error('Google service account credential is incomplete');
          }

          const auth = new GoogleAuth({
            credentials,
            scopes: ['https://www.googleapis.com/auth/cloud-platform']
          });
          const client = await auth.getClient();
          const access = await client.getAccessToken();
          const token = access && access.token;
          if (!token) throw new Error('Google service account did not return a Cloud access token');

          const root = 'https://serviceusage.googleapis.com/v1/';
          const service = 'androidpublisher.googleapis.com';
          const name = `projects/${project}/services/${service}`;

          async function call(path, options = {}) {
            const response = await fetch(root + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                ...(options.headers || {})
              }
            });
            const text = await response.text();
            let body = {};
            if (text) {
              try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 3000) }; }
            }
            if (!response.ok) {
              throw new Error(`Service Usage ${options.method || 'GET'} ${path} failed with HTTP ${response.status}: ${JSON.stringify(body).slice(0, 3000)}`);
            }
            return body;
          }

          const before = await call(name);
          if (before.state === 'ENABLED') {
            console.log(`${service} is already enabled in project ${project}.`);
            process.exit(0);
          }

          let operation = await call(`${name}:enable`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });

          for (let attempt = 0; attempt < 36 && !operation.done; attempt += 1) {
            await new Promise(resolve => setTimeout(resolve, 5000));
            operation = await call(operation.name);
          }
          if (!operation.done) throw new Error('Timed out waiting for Google Play Android Developer API enablement');
          if (operation.error) throw new Error(`API enablement operation failed: ${JSON.stringify(operation.error)}`);

          const after = await call(name);
          if (after.state !== 'ENABLED') {
            throw new Error(`${service} did not reach ENABLED state (state=${after.state || 'unknown'})`);
          }
          console.log(`Enabled ${service} in Google Cloud project ${project}.`);
          NODE

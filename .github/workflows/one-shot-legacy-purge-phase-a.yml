name: One-shot legacy UI purge phase A

on:
  push:
    branches:
      - refactor/remove-legacy-design-system

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Apply controlled legacy-theme migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def require(cond, msg):
              if not cond:
                  raise SystemExit(msg)

          # 1) Remove the no-op DesignRuntimeWiring component from MainMenu YAML,
          # then remove its compatibility script/meta. The script GUID is read
          # from the meta so this cannot accidentally target another component.
          meta_path = Path('Assets/SCRIPT/Design/DesignRuntimeWiring.cs.meta')
          scene_path = Path('Assets/Scenes/MainMenu.unity')
          require(meta_path.exists(), 'DesignRuntimeWiring meta missing before scene cleanup')
          meta = meta_path.read_text(encoding='utf-8')
          guid_match = re.search(r'(?m)^guid:\s*([0-9a-f]{32})\s*$', meta)
          require(guid_match, 'Could not resolve DesignRuntimeWiring GUID')
          guid = guid_match.group(1)
          scene = scene_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?ms)^--- !u!114 &(\d+)\r?\nMonoBehaviour:\r?\n'
              r'(?:(?!^--- !u!).)*?'
              + re.escape('m_Script: {fileID: 11500000, guid: ' + guid + ', type: 3}') +
              r'(?:(?!^--- !u!).)*?(?=^--- !u!|\Z)')
          match = pattern.search(scene)
          require(match, 'Serialized DesignRuntimeWiring MonoBehaviour not found in MainMenu')
          component_id = match.group(1)
          scene = scene[:match.start()] + scene[match.end():]
          scene, removed_ref = re.subn(
              rf'(?m)^  - component: \{{fileID: {component_id}\}}\r?\n', '', scene)
          require(removed_ref == 1,
                  f'Expected one GameObject component reference for {component_id}, got {removed_ref}')
          require(guid not in scene, 'DesignRuntimeWiring GUID still present after scene cleanup')
          scene_path.write_text(scene, encoding='utf-8')
          Path('Assets/SCRIPT/Design/DesignRuntimeWiring.cs').unlink()
          meta_path.unlink()

          # 2) Private Room: keep the real Button roots/listeners, delete every
          # old visual child before the sole current owner builds its content.
          pr_path = Path('Assets/SCRIPT/Design/PrivateRoomVisuals.cs')
          pr = pr_path.read_text(encoding='utf-8')
          anchor = '''        if (createButton == null || joinButton == null || backButton == null)\n        {\n            Debug.LogError("[PrivateRoomVisuals] Create/Join/Back controls are missing.");\n            IsReady = false;\n            return;\n        }\n\n'''
          require(anchor in pr, 'PrivateRoomVisuals control-validation anchor changed')
          pr = pr.replace(anchor, anchor + '''        // These Button roots come from PvpRuntimeUI because the controller owns\n        // their callbacks. Their historical child art/text is presentation only\n        // and must not survive beneath this sole production owner.\n        ClearButtonPresentation(createButton.transform);\n        ClearButtonPresentation(joinButton.transform);\n        ClearButtonPresentation(backButton.transform);\n\n''', 1)
          method_anchor = '''    static void HideButtonLabels(Transform root)\n    {\n'''
          require(method_anchor in pr, 'PrivateRoomVisuals helper anchor changed')
          clear_method = '''    static void ClearButtonPresentation(Transform root)\n    {\n        if (root == null) return;\n        for (int i = root.childCount - 1; i >= 0; i--)\n            RuntimeUI.DestroyNow(root.GetChild(i).gameObject);\n    }\n\n'''
          pr = pr.replace(method_anchor, clear_method + method_anchor, 1)
          pr_path.write_text(pr, encoding='utf-8')

          # 3) Settings: localize the music state with existing EN/EL yes/no
          # entries instead of hard-coded English ON/OFF.
          settings_path = Path('Assets/SCRIPT/Design/SettingsVisuals.cs')
          settings = settings_path.read_text(encoding='utf-8')
          old_refresh = 'musicStateText.text = musicToggle.isOn ? "ON" : "OFF";'
          require(old_refresh in settings, 'Settings ON/OFF refresh line changed')
          settings = settings.replace(
              old_refresh,
              'musicStateText.text = musicToggle.isOn ? L10n.Get("yes") : L10n.Get("no");', 1)
          old_initial = 'musicStateText = AddText(track.transform, "SettingsMusicState", "ON", 28,'
          require(old_initial in settings, 'Settings initial music-state line changed')
          settings = settings.replace(
              old_initial,
              'musicStateText = AddText(track.transform, "SettingsMusicState", L10n.Get("yes"), 28,', 1)
          settings_path.write_text(settings, encoding='utf-8')

          # 4) Move generic layout/color call sites away from the retired
          # ConvergingLight class. RuntimeUI owns neutral layout utilities only;
          # ConsumerTokens owns dynamic text/state colors, never sprite tinting.
          runtime_path = Path('Assets/SCRIPT/RuntimeUI/RuntimeUI.cs')
          runtime = runtime_path.read_text(encoding='utf-8')
          stretch_anchor = '''    public static void Stretch(GameObject go)\n    {\n        var rect = (RectTransform)go.transform;\n        rect.anchorMin = Vector2.zero;\n        rect.anchorMax = Vector2.one;\n        rect.offsetMin = Vector2.zero;\n        rect.offsetMax = Vector2.zero;\n    }\n\n'''
          require(stretch_anchor in runtime, 'RuntimeUI Stretch anchor changed')
          neutral_helpers = '''    public static void Center(GameObject go, Vector2 position, Vector2 size)\n    {\n        if (go == null) return;\n        var rect = (RectTransform)go.transform;\n        rect.anchorMin = rect.anchorMax = new Vector2(0.5f, 0.5f);\n        rect.pivot = new Vector2(0.5f, 0.5f);\n        rect.anchoredPosition = position;\n        rect.sizeDelta = size;\n        rect.localRotation = Quaternion.identity;\n        rect.localScale = Vector3.one;\n    }\n\n    static Sprite solidSprite;\n    public static Sprite SolidSprite\n    {\n        get\n        {\n            if (solidSprite != null) return solidSprite;\n            var texture = new Texture2D(1, 1, TextureFormat.RGBA32, false);\n            texture.SetPixel(0, 0, Color.white);\n            texture.Apply();\n            solidSprite = Sprite.Create(texture, new Rect(0, 0, 1, 1),\n                new Vector2(0.5f, 0.5f));\n            return solidSprite;\n        }\n    }\n\n    public static Sprite LoadProductionSprite(string resourcePath)\n    {\n        if (string.IsNullOrWhiteSpace(resourcePath)) return null;\n        var sprite = Resources.Load<Sprite>(resourcePath);\n        if (sprite == null)\n            Debug.LogError("HOL UI: missing approved production sprite Resources/" +\n                resourcePath + ".");\n        return sprite;\n    }\n\n'''
          runtime = runtime.replace(stretch_anchor, stretch_anchor + neutral_helpers, 1)
          runtime_path.write_text(runtime, encoding='utf-8')

          mappings = {
              'ConvergingLight.WithAlpha': 'ConsumerTokens.WithAlpha',
              'ConvergingLight.NearWhite': 'ConsumerTokens.TextPrimary',
              'ConvergingLight.Center': 'RuntimeUI.Center',
              'ConvergingLight.PanelIndigo': 'ConsumerTokens.Surface',
              'ConvergingLight.ScrimIndigo': 'ConsumerTokens.Background0',
              'ConvergingLight.DepthTop': 'ConsumerTokens.Background0',
              'ConvergingLight.DepthBottom': 'ConsumerTokens.Surface',
              'ConvergingLight.TrackIndigo': 'ConsumerTokens.SurfaceElevated',
              'ConvergingLight.Cyan': 'ConsumerTokens.Cyan',
              'ConvergingLight.Magenta': 'ConsumerTokens.Magenta',
              'ConvergingLight.Gold': 'ConsumerTokens.Gold',
              'ConvergingLight.DepthGradientSprite': 'RuntimeUI.LoadProductionSprite("phase2a/hol_neon_reference_bg_r3")',
          }
          for path in Path('Assets').rglob('*.cs'):
              if path.as_posix() == 'Assets/SCRIPT/Design/ConvergingLight.cs':
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mappings.items():
                  text = text.replace(old, new)
              text = text.replace(
                  'ConvergingLight.VerticalGradient(gold, gold, 4)',
                  'RuntimeUI.SolidSprite')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          remaining_number_field = []
          for path in Path('Assets').rglob('*.cs'):
              if path.name == 'ConvergingLight.cs':
                  continue
              if 'ConvergingLight.NumberField' in path.read_text(encoding='utf-8'):
                  remaining_number_field.append(str(path))
          require(not remaining_number_field,
                  'Unexpected NumberField callers: ' + ', '.join(remaining_number_field))

          Path('Assets/SCRIPT/Design/ConvergingLight.cs').unlink()
          conv_meta = Path('Assets/SCRIPT/Design/ConvergingLight.cs.meta')
          if conv_meta.exists(): conv_meta.unlink()

          Path('.github/workflows/one-shot-legacy-purge-phase-a.yml').unlink()
          PY

      - name: Audit migration residue
        shell: bash
        run: |
          echo '--- remaining retired production symbols ---'
          git grep -n -E 'ConvergingLight|DesignRuntimeWiring|NumberDrift|AttachmentReskin|ExactReferenceVisuals' -- 'Assets/**' || true
          echo '--- remaining NeonFrame callers ---'
          git grep -n 'NeonFrame' -- 'Assets/**/*.cs' || true
          echo '--- alpha near-zero hacks ---'
          git grep -n -E '0\.002f|0\.001f' -- 'Assets/**/*.cs' || true
          echo '--- rejected cloud background ---'
          git grep -n 'mainmenu_bg_stairs_clouds' -- . || true
          echo '--- modified files ---'
          git status --short

      - name: Commit controlled migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(ui): remove serialized legacy theme owner and hardcoded state'
          git push origin HEAD:refactor/remove-legacy-design-system

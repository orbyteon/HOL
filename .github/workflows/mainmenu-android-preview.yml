name: Main Menu Android Preview

on:
  pull_request:
    paths:
      - ".github/workflows/mainmenu-android-preview.yml"
      - "Assets/Editor/MainMenuPreviewBuild.cs"
      - "Assets/Editor/MainMenuPreviewBuild.cs.meta"
      - "Assets/SCRIPT/RuntimeUI/MainMenuCaptureBootstrap.cs"
      - "Assets/SCRIPT/RuntimeUI/MainMenuCaptureBootstrap.cs.meta"
      - "Assets/SCRIPT/Design/MainMenuAuthoritativeVisuals.cs"
      - "Assets/SCRIPT/Design/MainMenuAuthoritativeVisuals.cs.meta"
      - "Assets/Resources/mainmenu/**"
      - "Assets/Scenes/MainMenu.unity"
      - "Assets/Tests/PlayMode/MainMenuCapturePlayModeTests.cs"
      - "Assets/Tests/PlayMode/MainMenuCapturePlayModeTests.cs.meta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainmenu-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build development x86_64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See docs/release-checklist.md step 0."
              exit 1
            fi
          done

      - name: Free runner disk for Unity Android image
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-MainMenu-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-MainMenu-Android-
            Library-Android-
            Library-

      - name: Build exact Main Menu development APK
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: MainMenuPreviewBuild.Build

      - name: Require exact APK output
        shell: bash
        run: test -f build/Android/HOL-mainmenu-debug.apk

      - name: Transfer APK to emulator job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainmenu-preview-apk-transfer
          path: build/Android/HOL-mainmenu-debug.apk
          if-no-files-found: error
          retention-days: 1

  capture:
    name: Capture EN and EL at 1080x1920
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mainmenu-preview-apk-transfer
          path: build/Android

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Prepare capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mainmenu-capture.sh" <<'CAPTURE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          package="com.Orbyteon.HOL"
          activity="com.unity3d.player.UnityPlayerActivity"
          apk="build/Android/HOL-mainmenu-debug.apk"
          output="artifacts/mainmenu-preview"
          mkdir -p "$output"
          test -f "$apk"
          cp "$apk" "$output/HOL-mainmenu-debug.apk"
          : > "$output/logcat.txt"
          trap 'adb logcat -d -v threadtime >> artifacts/mainmenu-preview/logcat.txt || true' EXIT

          adb wait-for-device
          adb shell wm size 1080x1920
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb install -r "$apk"

          aapt_path="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)"
          {
            "$aapt_path" dump badging "$apk"
            echo
            adb shell wm size
            adb shell wm density
            adb shell pm path "$package"
            adb shell dumpsys package "$package"
          } > "$output/package-metadata.txt"

          validate_png() {
            python3 - "$1" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as image:
              header = image.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
              raise SystemExit(f"{path}: invalid PNG IHDR")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (1080, 1920):
              raise SystemExit(
                  f"{path}: expected 1080x1920, got {width}x{height}")
          print(f"{path}: {width}x{height}")
          PY
          }

          capture_language() {
            language="$1"
            marker="HOL_MAINMENU_CAPTURE_READY:$language"
            screenshot="$output/mainmenu-$language.png"

            adb shell am force-stop "$package"
            adb logcat -c
            adb shell am start -W \
              -n "$package/$activity" \
              --es hol_capture_language "$language"

            ready=0
            for attempt in $(seq 1 90); do
              adb logcat -d -v brief > /tmp/hol-mainmenu-logcat.txt
              if grep -Fq "$marker" /tmp/hol-mainmenu-logcat.txt; then
                ready=1
                break
              fi
              sleep 2
            done

            {
              echo "===== $language ====="
              adb logcat -d -v threadtime
            } >> "$output/logcat.txt"
            if [ "$ready" -ne 1 ]; then
              echo "::error::Timed out waiting for $marker"
              return 1
            fi

            adb exec-out screencap -p > "$screenshot"
            validate_png "$screenshot"
          }

          capture_language en
          capture_language el
          adb shell am force-stop "$package"

          (
            cd "$output"
            sha256sum \
              HOL-mainmenu-debug.apk \
              mainmenu-en.png \
              mainmenu-el.png > SHA256SUMS.txt
          )
          CAPTURE_SCRIPT
          chmod +x "$RUNNER_TEMP/mainmenu-capture.sh"

      - name: Boot API 35 x86_64 emulator and capture Main Menu
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ${{ runner.temp }}/mainmenu-capture.sh

      - name: Upload complete Main Menu preview artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hol-mainmenu-android-preview
          path: artifacts/mainmenu-preview
          if-no-files-found: error
          retention-days: 7

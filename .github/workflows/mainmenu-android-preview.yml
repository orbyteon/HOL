name: Main Menu Android Preview

# Opt-in Android preview: add label preview-mainmenu or run manually.
# Requires green CI on the same commit. See docs/ci-policy.md.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: hol-android-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'preview-mainmenu')
    outputs:
      checkout_ref: ${{ steps.merge_ref.outputs.ref }}
    steps:
      - name: Checkout actions for local composite steps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Block draft pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "::error::Mark the PR ready for review before requesting Android previews."
            exit 1
          fi

      - name: Require green CI on PR head
        uses: ./.github/actions/require-ci-green
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve merge ref for pull requests
        id: merge_ref
        uses: ./.github/actions/resolve-pr-merge-ref
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}

  build:
    name: Build development universal ARM64 + x86_64 APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout merge ref for pull requests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Require Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "::error::$name is not configured"
              exit 1
            }
          done

      - name: Free runner disk for Unity Android image
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-MainMenu-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Development universal ARM64 + x86_64 Main Menu APK
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: MainMenuPreviewBuild.Build
          versioning: None

      - name: Require exact APK output
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" build
          test -f build/Android/HOL-mainmenu-debug.apk

      - name: Transfer APK to emulator job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainmenu-preview-apk-transfer
          path: build/Android/HOL-mainmenu-debug.apk
          if-no-files-found: error
          retention-days: 1

  capture:
    name: Capture Main Menu EN/EL production viewport matrix
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout merge ref for pull requests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Download exact debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mainmenu-preview-apk-transfer
          path: build/Android

      - name: Require downloaded APK
        shell: bash
        run: test -f build/Android/HOL-mainmenu-debug.apk

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator runner will retry"
          fi

      - name: Prepare fail-safe bilingual viewport capture script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mainmenu-android-preview
          test -f build/Android/HOL-mainmenu-debug.apk
          cp build/Android/HOL-mainmenu-debug.apk \
            artifacts/mainmenu-android-preview/HOL-mainmenu-debug.apk

          for diagnostic in \
            logcat.txt \
            display-size-density.txt \
            display-metadata.txt \
            activity-state.txt \
            package-metadata.txt \
            package-path.txt \
            process-state.txt \
            install.log; do
            echo "Capture script did not start." \
              > "artifacts/mainmenu-android-preview/$diagnostic"
          done

          cat > "$RUNNER_TEMP/mainmenu-capture.sh" <<'CAPTURE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          apk="build/Android/HOL-mainmenu-debug.apk"
          output="artifacts/mainmenu-android-preview"
          aapt_path=
          package_name=
          launch_activity=

          wait_for_adb() {
            for wait_attempt in $(seq 1 30); do
              if adb wait-for-device >/dev/null 2>&1 &&
                 [ "$(adb get-state 2>/dev/null || true)" = "device" ]; then
                return 0
              fi
              sleep 1
            done
            echo "::error::adb device never became ready"
            return 1
          }

          collect_diagnostics() {
            status=$?
            trap - EXIT
            set +e
            mkdir -p "$output"
            if command -v adb >/dev/null 2>&1 &&
               adb get-state >/dev/null 2>&1; then
              adb logcat -d -v threadtime > "$output/logcat.txt" 2>&1
              {
                adb shell wm size
                adb shell wm density
              } > "$output/display-size-density.txt" 2>&1
              adb shell dumpsys display > "$output/display-metadata.txt" 2>&1
              adb shell dumpsys activity activities \
                > "$output/activity-state.txt" 2>&1
              if [ -n "${package_name:-}" ]; then
                adb shell dumpsys package "$package_name" \
                  > "$output/package-metadata.txt" 2>&1
                adb shell pm path "$package_name" \
                  > "$output/package-path.txt" 2>&1
                {
                  adb shell pidof "$package_name"
                  adb shell ps -A
                } > "$output/process-state.txt" 2>&1
              fi
            fi
            exit "$status"
          }
          trap 'collect_diagnostics' EXIT

          test -f "$apk"
          aapt_path="$(ls "$ANDROID_HOME"/build-tools/*/aapt |
            sort -V |
            tail -n 1)"
          test -x "$aapt_path"
          "$aapt_path" dump badging "$apk" > "$output/aapt-badging.txt"
          package_name=$("$aapt_path" dump badging "$apk" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          launch_activity=$("$aapt_path" dump badging "$apk" |
            sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
          test -n "$package_name"
          test -n "$launch_activity"

          wait_for_adb
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell wm density 420
          adb shell settings put secure immersive_mode_confirmations confirmed || true

          if adb install -r "$apk" > "$output/install.log" 2>&1; then
            :
          else
            status=$?
            exit "$status"
          fi

          capture_variant() {
            language="$1"
            width="$2"
            height="$3"
            filename="$4"
            token="$5"
            marker="HOL_MAINMENU_CAPTURE_READY:${token}"
            marker_log="$output/marker-${token}.txt"
            start_log="$output/start-${token}.log"

            echo "Capturing ${language} ${width}x${height}"
            adb shell am force-stop "$package_name" || true
            adb shell wm size "${width}x${height}"
            wait_for_adb

            if ! adb shell am start -W \
                -n "$package_name/$launch_activity" \
                --es hol_capture_screen mainmenu \
                --es hol_capture_language "$language" \
                --es hol_capture_token "$token" \
                > "$start_log" 2>&1; then
              return 1
            fi

            ready=0
            set +e
            for attempt in $(seq 1 120); do
              echo "${token} poll ${attempt}/120"
              if ! adb logcat -d -v threadtime > "$marker_log" 2>/dev/null; then
                wait_for_adb || true
                sleep 1
                continue
              fi
              if grep -Fq "$marker" "$marker_log"; then
                ready=1
                break
              fi
              sleep 1
            done
            set -e
            if [ "$ready" -ne 1 ]; then
              echo "::error::Timed out waiting for $marker"
              return 1
            fi
            marker_count=$(grep -Fc "$marker" "$marker_log" || true)
            if [ "$marker_count" -ne 1 ]; then
              echo "::error::Expected exactly one $marker marker"
              return 1
            fi

            adb exec-out screencap -p > "$output/$filename" || true
            if ! [ -s "$output/$filename" ]; then
              set +e
              for shot in $(seq 1 10); do
                wait_for_adb || true
                adb exec-out screencap -p > "$output/$filename"
                [ -s "$output/$filename" ] && break
                sleep 1
              done
              set -e
            fi
            test -s "$output/$filename"
            node tools/mainmenu/validate-mainmenu-screenshot.mjs \
              "$output/$filename" "$width" "$height"
          }

          capture_variant en 1080 1920 mainmenu-en-1080x1920.png en-1080x1920
          cp "$output/mainmenu-en-1080x1920.png" "$output/mainmenu.png"
          capture_variant el 1080 1920 mainmenu-el-1080x1920.png el-1080x1920
          capture_variant en 1080 2400 mainmenu-en-1080x2400.png en-1080x2400
          capture_variant el 1080 2400 mainmenu-el-1080x2400.png el-1080x2400
          capture_variant en 1179 2556 mainmenu-en-1179x2556.png en-1179x2556
          capture_variant el 1179 2556 mainmenu-el-1179x2556.png el-1179x2556

          (
            cd "$output"
            sha256sum \
              HOL-mainmenu-debug.apk \
              mainmenu.png \
              mainmenu-en-1080x1920.png \
              mainmenu-el-1080x1920.png \
              mainmenu-en-1080x2400.png \
              mainmenu-el-1080x2400.png \
              mainmenu-en-1179x2556.png \
              mainmenu-el-1179x2556.png \
              > SHA256SUMS
          )
          CAPTURE_SCRIPT
          chmod +x "$RUNNER_TEMP/mainmenu-capture.sh"

      - name: Boot API 35 x86_64 emulator and capture Main Menu matrix
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 576M
          emulator-boot-timeout: 1200
          emulator-options: "-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -feature -Vulkan"
          disable-animations: true
          script: bash ${{ runner.temp }}/mainmenu-capture.sh

      - name: Upload complete Main Menu Android preview artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hol-mainmenu-android-preview
          path: artifacts/mainmenu-android-preview
          if-no-files-found: error
          retention-days: 3

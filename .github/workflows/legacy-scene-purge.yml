name: Legacy Scene Purge Migration

on:
  push:
    branches:
      - refactor/remove-legacy-design-system
    paths:
      - .github/workflows/legacy-scene-purge.yml
      - Assets/Scenes/MainMenu.unity

permissions:
  contents: write

jobs:
  migrate-main-menu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 1

      - name: Remove retired Photos sprite bindings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Assets/Scenes/MainMenu.unity")
          text = path.read_text(encoding="utf-8")

          expected = {
              "095696152d2891c4cac3eff8af0fd162": 1,
              "1a935f75d6b849148b2070601df8a912": 1,
              "849315786c0d1f54289c6665d472a9df": 9,
              "13f50126943e4c74bb0f4213e8373eeb": 5,
              "c246ed3e243394a43b9144da86c2988e": 1,
          }

          for guid, count in expected.items():
              needle = f"m_Sprite: {{fileID: 21300000, guid: {guid}, type: 3}}"
              actual = text.count(needle)
              if actual != count:
                  raise SystemExit(
                      f"Refusing migration: {guid} expected {count} serialized sprite bindings, found {actual}."
                  )
              text = text.replace(needle, "m_Sprite: {fileID: 0}")

          retired_guids = tuple(expected)
          remaining = [guid for guid in retired_guids if guid in text]
          if remaining:
              raise SystemExit(f"Retired GUIDs still present after migration: {remaining}")

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate scene diff
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- Assets/Scenes/MainMenu.unity; then
            echo "MainMenu scene already migrated."
            exit 0
          fi
          git diff -- Assets/Scenes/MainMenu.unity

      - name: Commit migrated scene
        shell: bash
        run: |
          if git diff --quiet -- Assets/Scenes/MainMenu.unity; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scenes/MainMenu.unity
          git commit -m "Remove retired Photos bindings from MainMenu"
          git push origin HEAD:refactor/remove-legacy-design-system

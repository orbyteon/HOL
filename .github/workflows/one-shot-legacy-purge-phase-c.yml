name: One-shot legacy UI purge phase C

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Apply final solo-board migration
        run: python3 .github/scripts/legacy_purge_c.py

      - name: Strict source audit
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'RuntimeUI.RoundedRectSprite' -- 'Assets/SCRIPT/**/*.cs' ':!Assets/SCRIPT/RuntimeUI/RuntimeUI.cs'; then
            echo '::error::Procedural rounded sprite still used by production screen code'
            exit 1
          fi
          if git grep -n -E 'ConvergingLight|DesignRuntimeWiring|NeonFrame|NumberDrift|AttachmentReskin|ExactReferenceVisuals' -- 'Assets/SCRIPT/**/*.cs' 'Assets/Scenes/*.unity'; then
            echo '::error::Retired visual runtime symbol remains'
            exit 1
          fi
          echo '--- all RuntimeUI.CreateButton callers for ownership audit ---'
          git grep -n 'RuntimeUI.CreateButton' -- 'Assets/SCRIPT/**/*.cs' || true
          echo '--- all generic FullscreenPanel callers for ownership audit ---'
          git grep -n 'RuntimeUI.FullscreenPanel' -- 'Assets/SCRIPT/**/*.cs' || true
          echo '--- all generic CreateInputField callers for ownership audit ---'
          git grep -n 'RuntimeUI.CreateInputField' -- 'Assets/SCRIPT/**/*.cs' || true
          git status --short

      - name: Commit phase C migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-legacy-purge-phase-c.yml
          rm -f .github/scripts/legacy_purge_c.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(ui): finish solo-board production-art migration'
          git fetch origin refactor/remove-legacy-design-system
          git rebase origin/refactor/remove-legacy-design-system
          git push origin HEAD:refactor/remove-legacy-design-system

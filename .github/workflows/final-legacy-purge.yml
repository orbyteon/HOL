name: Final Legacy Purge Migration

on:
  push:
    branches:
      - refactor/remove-legacy-design-system
    paths:
      - .github/workflows/final-legacy-purge.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 2

      - name: Verify retired Photos folder is exactly the audited set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          folder = Path("Assets/Photos")
          if not folder.is_dir():
              raise SystemExit("Assets/Photos is already absent; refusing unexpected migration state.")

          pngs = {
              "1000032794.png",
              "HOLSPASH.png",
              "file_0000000084c4724399e7ba24d1cfdd36.png",
              "file_00000000a7a072438484999e9b21581a.png",
              "quit.png",
              "yournumber.png",
          }
          expected = pngs | {name + ".meta" for name in pngs}
          actual = {p.name for p in folder.iterdir() if p.is_file()}
          if actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"Refusing purge. Missing={missing}; unexpected={unexpected}"
              )

          if not Path("Assets/Photos.meta").is_file():
              raise SystemExit("Assets/Photos.meta is unexpectedly missing.")

          retired_guids = {
              "64caeb6646573fb43947e129d62dd329",
              "095696152d2891c4cac3eff8af0fd162",
              "1a935f75d6b849148b2070601df8a912",
              "849315786c0d1f54289c6665d472a9df",
              "13f50126943e4c74bb0f4213e8373eeb",
              "c246ed3e243394a43b9144da86c2988e",
          }
          for scene in Path("Assets/Scenes").glob("*.unity"):
              text = scene.read_text(encoding="utf-8")
              hits = sorted(g for g in retired_guids if g in text)
              if hits:
                  raise SystemExit(f"Retired Photos GUIDs still serialized in {scene}: {hits}")
          PY

      - name: Delete retired Photos artwork and temporary dependency audit
        shell: bash
        run: |
          git rm -r Assets/Photos Assets/Photos.meta
          git rm Assets/Tests/EditMode/LegacyAssetDependencyTests.cs Assets/Tests/EditMode/LegacyAssetDependencyTests.cs.meta

      - name: Add permanent fast production-tree hygiene gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          marker = "      - name: Verify Unity meta files for scripts\n"
          if text.count(marker) != 1:
              raise SystemExit("Could not locate unique Unity meta validation step in ci.yml")
          if "Enforce production visual tree hygiene" in text:
              raise SystemExit("Production visual tree hygiene gate already exists unexpectedly.")

          guard = '''      - name: Enforce production visual tree hygiene
        shell: bash
        run: |
          set -euo pipefail
          for retired_path in Assets/Photos Assets/Photos.meta Assets/UI Assets/UI.meta; do
            if [ -e "$retired_path" ]; then
              echo "::error file=$retired_path::Retired visual graveyard must not return to production Assets"
              exit 1
            fi
          done
          if grep -R -n -E 'ConvergingLight|DesignRuntimeWiring|NeonFrame|NumberDrift|FrameGeometry|ExactReferenceVisuals|AttachmentReskinVisuals|AttachmentReskinPolish|AttachmentReskinCanvasBindings' Assets/SCRIPT Assets/Scenes; then
            echo "::error::Retired visual architecture symbol returned to production code/scene"
            exit 1
          fi
          if grep -R -n -E '0\\.002f' Assets/SCRIPT; then
            echo "::error::Near-zero-alpha production sprite hiding returned"
            exit 1
          fi
          for retired_surface in background_deep panel_surface button_primary button_secondary; do
            if find Assets -type f -name "${retired_surface}.*" -print -quit | grep -q .; then
              echo "::error::Retired generic design surface returned: ${retired_surface}"
              exit 1
            fi
          done
          if find Assets -type f -name 'mainmenu_bg_stairs_clouds*' -print -quit | grep -q .; then
            echo "::error::Rejected cloud/stairs menu background returned"
            exit 1
          fi

'''
          path.write_text(text.replace(marker, guard + marker), encoding="utf-8", newline="\n")
          PY

      - name: Commit physical art purge
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml Assets
          git commit -m "Delete retired Photos artwork and guard production tree"

      - name: Make Private Room installer the sole lifecycle owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visuals_path = Path("Assets/SCRIPT/Design/PrivateRoomVisuals.cs")
          text = visuals_path.read_text(encoding="utf-8")
          import_line = "using UnityEngine.SceneManagement;\n"
          if text.count(import_line) != 1:
              raise SystemExit("Expected exactly one SceneManagement import in PrivateRoomVisuals.cs")
          text = text.replace(import_line, "")

          block = '''    [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
    static void Install()
    {
        SceneManager.sceneLoaded -= OnSceneLoaded;
        SceneManager.sceneLoaded += OnSceneLoaded;
    }

    static void OnSceneLoaded(Scene scene, LoadSceneMode mode)
    {
        if (!scene.IsValid() || !scene.isLoaded || scene.name == "SplashScene")
            return;

        foreach (var root in scene.GetRootGameObjects())
        {
            var controller = root.GetComponentInChildren<PvpGameController>(true);
            if (controller == null) continue;
            if (controller.GetComponent<PrivateRoomVisuals>() == null)
                controller.gameObject.AddComponent<PrivateRoomVisuals>();
            return;
        }
    }

'''
          if text.count(block) != 1:
              raise SystemExit("Expected exactly one redundant PrivateRoomVisuals install block")
          visuals_path.write_text(text.replace(block, ""), encoding="utf-8", newline="\n")

          test_path = Path("Assets/Tests/EditMode/PrivateRoomProductionAssetsTests.cs")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    [Test]
    public void RetiredGenericThemeSurfacesCannotLoad()
'''
          if tests.count(marker) != 1:
              raise SystemExit("Could not locate PrivateRoom test insertion point")
          if "PrivateRoomInstallerIsTheOnlyRuntimeLifecycleOwner" in tests:
              raise SystemExit("Lifecycle ownership test already exists unexpectedly")

          new_test = '''    [Test]
    public void PrivateRoomInstallerIsTheOnlyRuntimeLifecycleOwner()
    {
        Type visuals = RuntimeType("PrivateRoomVisuals");
        Type installer = RuntimeType("PrivateRoomVisualsInstaller");
        Assert.That(visuals, Is.Not.Null);
        Assert.That(installer, Is.Not.Null);

        foreach (MethodInfo method in visuals.GetMethods(
            BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic))
        {
            object[] attributes = method.GetCustomAttributes(
                typeof(RuntimeInitializeOnLoadMethodAttribute), false);
            Assert.That(attributes, Is.Empty,
                "PrivateRoomVisuals must not register its own runtime lifecycle hook: " + method.Name);
        }

        MethodInfo register = installer.GetMethod("Register",
            BindingFlags.Static | BindingFlags.NonPublic);
        Assert.That(register, Is.Not.Null);
        Assert.That(register.GetCustomAttributes(
            typeof(RuntimeInitializeOnLoadMethodAttribute), false), Is.Not.Empty,
            "PrivateRoomVisualsInstaller must remain the sole runtime lifecycle bridge.");
    }

'''
          test_path.write_text(tests.replace(marker, new_test + marker), encoding="utf-8", newline="\n")
          PY

      - name: Commit lifecycle cleanup and push
        shell: bash
        run: |
          git diff --check
          git add Assets/SCRIPT/Design/PrivateRoomVisuals.cs Assets/Tests/EditMode/PrivateRoomProductionAssetsTests.cs
          git commit -m "Make PrivateRoom installer sole lifecycle owner"
          git push origin HEAD:refactor/remove-legacy-design-system

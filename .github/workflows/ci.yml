# CI: compile-verify the Unity project on every PR and push to main.
#
# Uses GameCI (game.ci) to run an Android build — the truthful check for
# this project, since a successful build requires every script to compile
# for the shipping platform.
#
# ONE-TIME SETUP (repo admin) — without it the build job SKIPS (not fails):
#   1. Get a Unity license activation file (.ulf) for 2022.3.x:
#      https://game.ci/docs/github/activation
#      (Personal license: run the manual-activation flow once, locally.)
#   2. Repo → Settings → Secrets and variables → Actions → add:
#        UNITY_LICENSE  — full contents of the .ulf file
#        UNITY_EMAIL    — Unity account email
#        UNITY_PASSWORD — Unity account password
#
# The check-license job exists because GitHub Actions cannot reference
# `secrets` in a job-level `if` directly.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-license:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    outputs:
      has-license: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret not set — Unity build check skipped. See .github/workflows/ci.yml header for setup."
          fi

  build:
    name: Build Android (compile check)
    needs: check-license
    if: needs.check-license.outputs.has-license == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          # Debug-keystore APK is fine — this job verifies compilation and
          # asset import, not release packaging (that stays manual, with the
          # HOL release keystore, per docs/release-checklist.md).
          androidExportType: androidPackage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hol-android-debug
          path: build/Android
          retention-days: 7

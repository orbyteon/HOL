# CI: static integrity + server bootstrap tests + Unity EditMode tests + Android compile build.
# Unity credentials are mandatory: missing secrets make CI fail loudly instead
# of producing a misleading green run with the real jobs skipped.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JavaScript syntax
        run: |
          node --check playfab/cloudscript.js
          node --check tools/playfab/deploy-cloudscript.mjs
          node --check tools/release/write-release-config.mjs
          node --check services/provisioner/src/index.js
          node --check services/provisioner/src/security.js

      - name: Enforce server-authoritative PlayFab client
        shell: bash
        run: |
          set -euo pipefail
          file=Assets/SCRIPT/PvP/PlayFabPvpClient.cs
          if grep -Eq 'Api\("(CreateSharedGroup|GetSharedGroupData|UpdateSharedGroupData|AddSharedGroupMembers|RemoveSharedGroupMembers)' "$file"; then
            echo "::error::PlayFabPvpClient must not call Shared Group client APIs directly"
            exit 1
          fi
          grep -q 'ExecuteCloudScript' "$file"
          grep -q 'Permission: "Private"' playfab/cloudscript.js
          if grep -q 'args.side' playfab/cloudscript.js; then
            echo "::error::CloudScript must derive the player side from currentPlayerId"
            exit 1
          fi
          if grep -q 'AddSharedGroupMembers' playfab/cloudscript.js; then
            echo "::error::PvP Shared Groups must have no client members; CloudScript tracks host/guest IDs itself"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('playfab/cloudscript.js', 'utf8');
          const start = source.indexOf('function viewFor(');
          // End at viewFor's own closing brace (column 0), not at whatever
          // happens to sit before handlers.createRoom — helpers added between
          // the two would otherwise be scanned as if they were the client view.
          const end = source.indexOf('\n}\n', start);
          if (start < 0 || end < 0) {
            console.error('::error::Could not isolate CloudScript viewFor()');
            process.exit(1);
          }
          const view = source.slice(start, end);
          for (const forbidden of ['hostSecret:', 'guestSecret:', 'hostId:', 'guestId:']) {
            if (view.includes(forbidden)) {
              console.error(`::error::PlayFab client view leaks private field ${forbidden.slice(0, -1)}`);
              process.exit(1);
            }
          }
          for (const required of ['lastHint:', 'revealedSecret:', 'hostGuessCount:', 'guestGuessCount:']) {
            if (!view.includes(required)) {
              console.error(`::error::PlayFab client view is missing ${required.slice(0, -1)}`);
              process.exit(1);
            }
          }
          NODE

      - name: Enforce production provisioning boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CreateAccount\\":' Assets/SCRIPT/PvP/PlayFabPvpClient.cs
          grep -q 'PlayIntegrityProvisioner' Assets/SCRIPT/PvP/PlayFabPvpClient.cs
          grep -q 'Server/LoginWithCustomID' services/provisioner/src/index.js
          grep -q 'MEETS_DEVICE_INTEGRITY' services/provisioner/src/security.js
          grep -q 'PLAY_RECOGNIZED' services/provisioner/src/security.js
          grep -q 'ReleaseConfig.IsConfigured' Assets/SCRIPT/ReleaseBootstrap.cs
          if grep -R -E 'PLAYFAB_DEV_SECRET_KEY|X-SecretKey' Assets --include='*.cs' --include='*.json' --include='*.txt'; then
            echo "::error::Server PlayFab credentials/references must never be compiled into Unity Assets"
            exit 1
          fi

      - name: Enforce release configuration contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('Assets/Resources/HOLReleaseConfig.json', 'utf8'));
          if ((p.playFabTitleId || '').trim() || (p.provisioningUrl || '').trim() || Number(p.googleCloudProjectNumber) !== 0) {
            console.error('::error::Committed HOLReleaseConfig.json must stay empty; production values are injected by build-release.yml');
            process.exit(1);
          }
          NODE
          grep -q 'customParameters: -holReleaseBuild' .github/workflows/build-release.yml
          grep -q 'allowDirtyBuild: true' .github/workflows/build-release.yml
          grep -q 'refs/heads/main' .github/workflows/build-release.yml
          grep -q 'Release workspace must differ from main only by injected HOLReleaseConfig.json' .github/workflows/build-release.yml
          grep -q 'jarsigner -verify' .github/workflows/build-release.yml
          grep -q 'PlayerSettings.Android.useCustomKeystore = true' Assets/Editor/ReleaseBuildGuard.cs
          grep -q 'AndroidSdkVersions.AndroidApiLevel36' Assets/Editor/ReleaseBuildGuard.cs
          grep -q 'AndroidTargetSdkVersion: 36' ProjectSettings/ProjectSettings.asset

      - name: Enforce production workflow gates
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/build-release.yml \
            .github/workflows/deploy-playfab.yml \
            .github/workflows/deploy-provisioner.yml \
            .github/workflows/set-min-version.yml; do
            grep -q 'environment: production' "$workflow"
            grep -q 'refs/heads/main' "$workflow"
          done
          grep -q 'Confirmation must be exactly BUILD' .github/workflows/build-release.yml
          grep -q 'Confirmation must be exactly DEPLOY' .github/workflows/deploy-playfab.yml
          grep -q 'Confirmation must be exactly DEPLOY' .github/workflows/deploy-provisioner.yml
          grep -q 'Confirmation must be exactly SET' .github/workflows/set-min-version.yml
          # The gate writes one fixed key; an operator-supplied key name would
          # turn a release step into arbitrary production Title Data access.
          if grep -qE '^\s*(key|title_data_key):' .github/workflows/set-min-version.yml; then
            echo "::error::set-min-version must not accept an operator-chosen Title Data key"
            exit 1
          fi
          grep -q 'GOOGLE_PLAY_CERT_SHA256' .github/workflows/deploy-provisioner.yml
          grep -q 'Provisioning endpoint did not become healthy' .github/workflows/deploy-provisioner.yml
          grep -q 'HARDEN_SHARED_GROUP_POLICY: "true"' .github/workflows/deploy-playfab.yml
          if grep -q 'harden_shared_group_policy:' .github/workflows/deploy-playfab.yml; then
            echo "::error::Production PlayFab policy hardening must not be operator-optional"
            exit 1
          fi
          grep -q 'verifySharedGroupPolicy' tools/playfab/deploy-cloudscript.mjs
          grep -q 'ensureCleanupTask' tools/playfab/deploy-cloudscript.mjs

      - name: Enforce dependency and workflow pinning
        shell: bash
        run: |
          set -euo pipefail
          test -f services/provisioner/package-lock.json
          grep -q 'npm ci --no-audit --no-fund' .github/workflows/ci.yml
          grep -q 'npm ci --no-audit --no-fund' .github/workflows/deploy-provisioner.yml
          if grep -R -nE '^\s*uses:\s*[^#[:space:]]+@(v[0-9]+|main|master)([[:space:]]|$)' .github/workflows; then
            echo "::error::Third-party Actions must be pinned to full commit SHAs"
            exit 1
          fi

      - name: Enforce one server-authoritative PvP backend
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Assets/SCRIPT/PvP/PvpClient.cs
          if grep -R -nE 'Firebase|firebaseDatabaseUrl|usePlayFab' Assets/SCRIPT --include='*.cs'; then
            echo "::error::Client-writable Firebase PvP fallback must not return"
            exit 1
          fi

      - name: Enforce one dependency resolver source
        shell: bash
        run: |
          set -euo pipefail
          # Google Play Integrity Unity 2.0.0 currently has an upstream V2 compile bug
          # (google/play-integrity-unity#2). Keep HOL on the stable Standard API until fixed.
          grep -q '"com.google.play.integrity": "1.4.1"' Packages/manifest.json
          if [ -e Assets/MobileDependencyResolver ]; then
            echo "::error::EDM4U is supplied through UPM for Play Integrity; do not also embed Assets/MobileDependencyResolver"
            exit 1
          fi

      - name: Verify Unity meta files for scripts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            if [ ! -f "$file.meta" ]; then
              echo "::error file=$file::Missing Unity .meta file"
              missing=1
            fi
          done < <(find Assets -type f -name '*.cs' -print0)
          exit "$missing"

  provisioner-test:
    name: Provisioner tests
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install, test, and syntax-check
        working-directory: services/provisioner
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check

  rules-tests:
    name: Duel rule tests
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The duel rules exist twice — playfab/cloudscript.js for PlayFab and
      # Assets/SCRIPT/DuelRules.cs for solo — and only the JavaScript side can
      # be executed without Unity. These run the real CloudScript against an
      # in-memory Shared Group store, and check every key it emits against
      # PvpBackend.RoomState, which JsonUtility binds by exact field name.
      - name: Syntax-check CloudScript and run the rule tests
        run: |
          node --check playfab/cloudscript.js
          node --test tools/test/*.test.mjs

  check-license:
    name: Require Unity credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See docs/release-checklist.md step 0."
              missing=1
            fi
          done
          exit "$missing"

  test:
    name: EditMode tests
    needs: [static-checks, provisioner-test, rules-tests, check-license]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts
          retention-days: 7

  build:
    name: Build Android (compile check)
    needs: [static-checks, provisioner-test, rules-tests, check-license]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk for Unity Android image
        shell: bash
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune -af || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Unity build
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hol-android-debug
          path: build/Android
          retention-days: 7

# CI: static integrity + Unity EditMode tests + Android compile build.
# Unity credentials are mandatory: missing secrets make CI fail loudly instead
# of producing a misleading green run with the real jobs skipped.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PlayFab CloudScript syntax
        run: node --check playfab/cloudscript.js

      - name: Enforce server-authoritative PlayFab client
        shell: bash
        run: |
          set -euo pipefail
          file=Assets/SCRIPT/PvP/PlayFabPvpClient.cs
          if grep -Eq 'Api\("(CreateSharedGroup|GetSharedGroupData|UpdateSharedGroupData|AddSharedGroupMembers|RemoveSharedGroupMembers)' "$file"; then
            echo "::error::PlayFabPvpClient must not call Shared Group client APIs directly"
            exit 1
          fi
          grep -q 'ExecuteCloudScript' "$file"
          grep -q 'Permission: "Private"' playfab/cloudscript.js
          if grep -q 'args.side' playfab/cloudscript.js; then
            echo "::error::CloudScript must derive the player side from currentPlayerId"
            exit 1
          fi
          if grep -q 'AddSharedGroupMembers' playfab/cloudscript.js; then
            echo "::error::PvP Shared Groups must have no client members; CloudScript tracks host/guest IDs itself"
            exit 1
          fi

      - name: Verify Unity meta files for scripts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            if [ ! -f "$file.meta" ]; then
              echo "::error file=$file::Missing Unity .meta file"
              missing=1
            fi
          done < <(find Assets -type f -name '*.cs' -print0)
          exit "$missing"

  check-license:
    name: Require Unity credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See docs/release-checklist.md step 0."
              missing=1
            fi
          done
          exit "$missing"

  test:
    name: EditMode tests
    needs: [static-checks, check-license]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
          retention-days: 7

  build:
    name: Build Android (compile check)
    needs: [static-checks, check-license]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk for Unity Android image
        shell: bash
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android
          docker system prune -af || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hol-android-debug
          path: build/Android
          retention-days: 7

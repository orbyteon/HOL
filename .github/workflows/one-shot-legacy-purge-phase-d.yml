name: One-shot legacy UI purge phase D

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Apply runtime-wiring cleanup
        run: python3 .github/scripts/legacy_purge_d.py

      - name: Deep visual-source audit
        shell: bash
        run: |
          set -euo pipefail
          echo '--- forbidden retired production symbols ---'
          if git grep -n -E 'ConvergingLight|DesignRuntimeWiring|NeonFrame|NumberDrift|AttachmentReskin|ExactReferenceVisuals' -- 'Assets/SCRIPT/**/*.cs' 'Assets/Scenes/*.unity'; then
            echo '::error::Retired visual runtime symbol remains'
            exit 1
          fi
          echo '--- procedural rounded sprite outside infrastructure ---'
          if git grep -n 'RuntimeUI.RoundedRectSprite' -- 'Assets/SCRIPT/**/*.cs' ':!Assets/SCRIPT/RuntimeUI/RuntimeUI.cs'; then
            echo '::error::Procedural rounded sprite still used by production screen code'
            exit 1
          fi
          echo '--- custom MaskableGraphic classes (manual review output) ---'
          git grep -n ': MaskableGraphic' -- 'Assets/SCRIPT/**/*.cs' || true
          echo '--- runtime Texture2D generation outside neutral RuntimeUI fallback ---'
          git grep -n 'new Texture2D' -- 'Assets/SCRIPT/**/*.cs' ':!Assets/SCRIPT/RuntimeUI/RuntimeUI.cs' || true
          echo '--- Sprite.Create outside neutral RuntimeUI fallback ---'
          git grep -n 'Sprite.Create' -- 'Assets/SCRIPT/**/*.cs' ':!Assets/SCRIPT/RuntimeUI/RuntimeUI.cs' || true
          echo '--- low alpha literals in production source ---'
          git grep -n -E '0\.00[0-9]f' -- 'Assets/SCRIPT/**/*.cs' || true
          echo '--- stale retired-design wording ---'
          git grep -n -E 'design/philosophy\.md|Converging Light' -- 'Assets/SCRIPT/**/*.cs' || true
          echo '--- deleted background / generic surfaces ---'
          if git grep -n -E 'mainmenu_bg_stairs_clouds|design/(background_deep|panel_surface|button_primary|button_secondary)' -- 'Assets/SCRIPT/**/*.cs' 'Assets/Scenes/*.unity'; then
            echo '::error::Retired production asset reference remains'
            exit 1
          fi
          git status --short

      - name: Commit phase D migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-legacy-purge-phase-d.yml
          rm -f .github/scripts/legacy_purge_d.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(ui): finish runtime-wiring production-art cleanup'
          git fetch origin refactor/remove-legacy-design-system
          git rebase origin/refactor/remove-legacy-design-system
          git push origin HEAD:refactor/remove-legacy-design-system

name: Deploy Provisioning Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hol-provisioner-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy attested bootstrap
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      FUNCTION_PATH: services/provisioner
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_CERT_SHA256: ${{ vars.GOOGLE_PLAY_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          PLAYFAB_TITLE_ID: ${{ secrets.PLAYFAB_TITLE_ID }}
          PLAYFAB_DEV_SECRET_KEY: ${{ secrets.PLAYFAB_DEV_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_FUNCTIONAPP_NAME AZURE_RESOURCE_GROUP GOOGLE_PLAY_PACKAGE_NAME \
                      PLAYFAB_TITLE_ID PLAYFAB_DEV_SECRET_KEY GOOGLE_SERVICE_ACCOUNT_JSON_B64 \
                      AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/provisioner/package-lock.json

      - name: Install and test provisioner
        working-directory: ${{ env.FUNCTION_PATH }}
        run: |
          npm ci
          npm test
          npm run check

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure production app settings
        shell: bash
        env:
          PLAYFAB_TITLE_ID: ${{ secrets.PLAYFAB_TITLE_ID }}
          PLAYFAB_DEV_SECRET_KEY: ${{ secrets.PLAYFAB_DEV_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings \
              PLAYFAB_TITLE_ID="$PLAYFAB_TITLE_ID" \
              PLAYFAB_DEV_SECRET_KEY="$PLAYFAB_DEV_SECRET_KEY" \
              GOOGLE_PLAY_PACKAGE_NAME="$GOOGLE_PLAY_PACKAGE_NAME" \
              GOOGLE_SERVICE_ACCOUNT_JSON_B64="$GOOGLE_SERVICE_ACCOUNT_JSON_B64" \
              GOOGLE_PLAY_CERT_SHA256="$GOOGLE_PLAY_CERT_SHA256" \
              REQUIRE_LICENSED=true \
              INTEGRITY_MAX_AGE_MS=120000 \
              FUNCTIONS_NODE_BLOCK_ON_ENTRY_POINT_ERROR=true \
            --output none

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.FUNCTION_PATH }}

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## HOL provisioning service"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Function App: \`${AZURE_FUNCTIONAPP_NAME}\`"
            echo "- Endpoint: \`https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/provision\`"
            echo "- Play Integrity licensing required: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

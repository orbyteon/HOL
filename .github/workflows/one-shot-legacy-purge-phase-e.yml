name: One-shot legacy UI purge phase E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Tighten GUID reference audit
        run: python3 .github/scripts/fix_legacy_purge_e_refs.py

      - name: Audit and purge legacy asset graveyards
        run: python3 .github/scripts/legacy_purge_e.py

      - name: Strict post-purge audit
        shell: bash
        run: |
          set -euo pipefail
          echo '--- retired runtime and old concept names ---'
          if git grep -n -E 'ConvergingLight|DesignRuntimeWiring|NeonFrame|NumberDrift|AttachmentReskin|ExactReferenceVisuals|FrameGeometry|ConsumerTokens|HOL Consumer First' -- 'Assets/SCRIPT/**/*.cs' 'Assets/Scenes/*.unity' 'Assets/newdesign/*.md' 'Assets/newdesign/*.json'; then
            echo '::error::Retired visual/concept symbol remains in current production source/docs'
            exit 1
          fi
          echo '--- stale generic design surfaces in production references ---'
          if git grep -n -E 'background_deep\.svg|panel_surface\.svg|button_primary\.svg|button_secondary\.svg|mainmenu_bg_stairs_clouds' -- 'Assets/SCRIPT/**' 'Assets/Scenes/**' 'Assets/newdesign/*.md' 'Assets/newdesign/*.json' ProjectSettings Packages docs; then
            echo '::error::Retired generic design surface reference remains in production source/docs'
            exit 1
          fi
          echo '--- forbidden production fallback / alpha hacks ---'
          if git grep -n 'RuntimeUI.RoundedRectSprite' -- 'Assets/SCRIPT/**/*.cs' ':!Assets/SCRIPT/RuntimeUI/RuntimeUI.cs'; then
            echo '::error::Production screen still uses procedural fallback'
            exit 1
          fi
          if git grep -n -E 'new Color\([^\n;]*,\s*0\.00[12]f\s*\)' -- 'Assets/SCRIPT/**/*.cs'; then
            echo '::error::Near-zero production alpha hack remains'
            exit 1
          fi
          echo '--- obsolete newdesign source pack must be gone ---'
          for p in ads avatars badges cosmetics navigation number-system results signals design-tokens.json asset-inventory.md icon_lock.svg icon_reaction.svg icon_rewarded_ad.svg icon_trophy.svg; do
            if [ -e "Assets/newdesign/$p" ]; then
              echo "::error::Legacy source-pack item remains: Assets/newdesign/$p"
              exit 1
            fi
          done
          echo '--- branding may retain only the referenced app icon ---'
          if [ -d Assets/newdesign/branding ]; then
            unexpected=$(find Assets/newdesign/branding -type f ! -name 'hol_app_icon_exact.png' ! -name 'hol_app_icon_exact.png.meta' | wc -l)
            if [ "$unexpected" -ne 0 ]; then
              echo '::error::Unreferenced legacy branding assets remain'
              find Assets/newdesign/branding -type f | sort
              exit 1
            fi
          fi
          echo '--- old original-design folders: show only surviving referenced files ---'
          find Assets/UI Assets/Photos -maxdepth 2 -type f 2>/dev/null | sort || true
          echo '--- diff ---'
          git status --short

      - name: Commit phase E purge
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-legacy-purge-phase-e.yml
          rm -f .github/scripts/legacy_purge_e.py
          rm -f .github/scripts/fix_legacy_purge_e_refs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(ui): purge obsolete design source packs and rename state colors'
          git fetch origin refactor/remove-legacy-design-system
          git rebase origin/refactor/remove-legacy-design-system
          git push origin HEAD:refactor/remove-legacy-design-system

name: One-shot legacy UI purge phase E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Diagnose synthetic GUID references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('Assets/newdesign/avatars/frame_neutral.svg.meta'),
              Path('Assets/newdesign/avatars/state_disconnected.svg.meta'),
          ]
          for meta in targets:
              text = meta.read_text(encoding='utf-8')
              m = re.search(r'(?m)^guid:\s*([0-9a-f]{32})\s*$', text)
              if not m:
                  raise SystemExit(f'No GUID in {meta}')
              guid = m.group(1)
              print(f'=== {meta} -> {guid} ===')
              owners = []
              for other in Path('Assets').rglob('*.meta'):
                  try:
                      body = other.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if re.search(rf'(?m)^guid:\s*{re.escape(guid)}\s*$', body):
                      owners.append(other.as_posix())
              print('owners:')
              for owner in owners:
                  print('  ', owner)
              print('reference contexts:')
              for base in [Path('Assets'), Path('ProjectSettings'), Path('Packages')]:
                  if not base.exists():
                      continue
                  for candidate in base.rglob('*'):
                      if not candidate.is_file() or candidate.suffix == '.meta':
                          continue
                      try:
                          body = candidate.read_text(encoding='utf-8')
                      except (UnicodeDecodeError, OSError):
                          continue
                      if guid not in body:
                          continue
                      lines = body.splitlines()
                      for i, line in enumerate(lines):
                          if guid in line:
                              lo = max(0, i - 3)
                              hi = min(len(lines), i + 4)
                              print(f'--- {candidate}:{i+1} ---')
                              for j in range(lo, hi):
                                  print(f'{j+1}: {lines[j]}')
          PY

      - name: Stop before deletion
        run: |
          echo 'Diagnostic-only pass complete; inspect contexts before any destructive purge.'
          exit 1

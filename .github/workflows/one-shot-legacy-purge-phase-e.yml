name: One-shot legacy UI purge phase E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout purge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-legacy-design-system
          fetch-depth: 0

      - name: Diagnose synthetic GUID references
        shell: bash
        run: |
          set -euo pipefail
          for guid in 10000000000000000000000000000001 10000000000000000000000000000003; do
            echo "=== GUID $guid: meta owners ==="
            git grep -n "^guid: $guid$" -- 'Assets/**/*.meta' || true
            echo "=== GUID $guid: reference contexts ==="
            git grep -n -C 3 "$guid" -- 'Assets/**/*.asset' 'Assets/**/*.prefab' 'Assets/**/*.unity' 'ProjectSettings/**' 'Packages/**' || true
          done

      - name: Stop before deletion
        run: |
          echo 'Diagnostic-only pass complete; inspect contexts before any destructive purge.'
          exit 1

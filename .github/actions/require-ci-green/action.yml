name: Require CI green
description: Fail unless the CI workflow completed successfully on the given commit.

inputs:
  sha:
    description: Commit SHA that must have a successful CI workflow run.
    required: true

runs:
  using: composite
  steps:
    - name: Require successful CI workflow on commit
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        conclusion="$(
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" \
            -f status=completed \
            -f per_page=1 \
            --jq '.workflow_runs[0].conclusion // empty'
        )"
        if [ -z "$conclusion" ]; then
          echo "::error::No completed CI run found for ${SHA}. Wait for CI on this commit before starting expensive jobs."
          exit 1
        fi
        if [ "$conclusion" != "success" ]; then
          echo "::error::Latest CI run for ${SHA} concluded with: ${conclusion}. Fix CI or push a new commit before expensive jobs."
          exit 1
        fi
        echo "CI succeeded on ${SHA}"
